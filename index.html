<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout - JCS Software</title></head><body style="background-color:#f4f6f9;margin:0;padding:20px;font-family:Arial,sans-serif;"><div id="manutencao-tela" style="display:none;text-align:center;margin-top:100px;"><h1 style="color:#cc092f;">Aviso do Sistema</h1><h2>JCS_Software v1.0.0 em Manutenção</h2></div><div id="jcs-checkout-container" style="max-width:600px;margin:40px auto;padding:25px;border:1px solid #e1e4e8;border-radius:12px;background:#fff;"><h3>Condições de Venda, Logística e Aceite</h3><div style="height:150px;overflow-y:scroll;border:1px solid #d1d5db;padding:15px;background:#f8fafc;font-size:13px;line-height:1.6;margin-bottom:15px;"><strong>1. LOGÍSTICA:</strong> Entrega pós-compensação ou dinheiro/Pix à vista.<br><br><strong>2. COMPATIBILIDADE iOS:</strong> Desativar Pop-ups no Safari para abrir Zap e Bradesco.</div><label style="display:flex;align-items:flex-start;cursor:pointer;font-size:13px;font-weight:bold;"><input type='checkbox' id='chk-aceite' style='margin-right:12px;transform:scale(1.2);' onchange='validarTermo()'><span>Li e aceito as Condições.</span></label><div style="display:flex;flex-direction:column;gap:12px;margin-top:20px;"><a id="btn-zap" href="https://wa.me" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;background:#25D366;color:#fff;padding:14px;text-decoration:none;border-radius:6px;font-weight:bold;pointer-events:none;opacity:0.5;">Chamar no Zap</a><a id="btn-pagamento" href="https://bradesco.com.br" target="_blank" rel="noopener noreferrer" style="display:block;text-align:center;background:#cc092f;color:#fff;padding:14px;text-decoration:none;border-radius:6px;font-weight:bold;pointer-events:none;opacity:0.5;">Pagar via Bradesco / Pix / Dinheiro</a></div></div><div id="painel-adm" style="display:none;max-width:600px;margin:20px auto;padding:15px;background:#222;color:#fff;border-radius:8px;text-align:center;"><h3>Painel ADM</h3><button id="btn-status" onclick="alternarStatus()" style="background:#25D366;color:#fff;border:none;padding:10px 20px;font-weight:bold;border-radius:5px;">Status: ONLINE</button></div><script>var somAtivado=false;var audioAlerta=new Audio('https://soundjay.com');function iniciarSom(){if(!somAtivado){audioAlerta.play().then(()=>{audioAlerta.pause();audioAlerta.currentTime=0;somAtivado=true;});}}function validarTermo(){var chk=document.getElementById('chk-aceite');var zap=document.getElementById('btn-zap');var pag=document.getElementById('btn-pagamento');iniciarSom();if(chk.checked){zap.style.pointerEvents='auto';zap.style.opacity='1';pag.style.pointerEvents='auto';pag.style.opacity='1';if(somAtivado)audioAlerta.play();}else{zap.style.pointerEvents='none';zap.style.opacity='0.5';pag.style.pointerEvents='none';pag.style.opacity='0.5';}}const urlParams=new URLSearchParams(window.location.search);if(urlParams.get('adm')==='1'){document.getElementById('painel-adm').style.display='block';}if(localStorage.getItem('site_status')==='offline'){aplicarStatusOffline();}function alternarStatus(){if(localStorage.getItem('site_status')==='offline'){localStorage.setItem('site_status','online');}else{localStorage.setItem('site_status','offline');}location.reload();}function aplicarStatusOffline(){document.getElementById('jcs-checkout-container').style.display='none';document.getElementById('manutencao-tela').style.display='block';var btn=document.getElementById('btn-status');if(btn){btn.innerText='Status: EM MANUTENÇÃO';btn.style.background='#cc092f';}}</script></body></html>
