<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro - Faturamento</title>
    <style>
        body {
            background-color: #0b2413; /* Verde-escuro Agro-Premium */
            color: #d4af37; /* Letras em Ouro Velho */
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 450px;
            background: rgba(11, 36, 19, 0.9);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 25px;
            font-style: italic;
        }
        .qrcode-box img {
            max-width: 220px;
            border: 4px solid #d4af37;
            border-radius: 10px;
            background-color: white;
            padding: 5px;
        }
        .terms-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #d4af37;
            padding: 15px;
            margin: 25px 0;
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .terms-title {
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.95rem;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .checkbox-container input {
            accent-color: #d4af37;
            transform: scale(1.3);
            cursor: pointer;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .btn-zap {
            background-color: #25d366;
            color: white;
        }
        .btn-bradesco {
            background-color: #cc092f;
            color: white;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .disabled {
            background-color: #555 !important;
            color: #aaa !important;
            cursor: not-allowed;
            pointer-events: none;
            transform: none !important;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mairiporã Agro</h1>
        <div class="subtitle">Logística e Faturamento Organizado</div>

        <!-- Bloco do QR Code -->
        <div class="qrcode-box">
            <!-- Substitua 'imagen' pelo nome exato com a extensão se necessário, ex: imagen.png ou qrcode.jpg -->
            <img src="imagen" alt="QR Code Oficial Pix">
        </div>

        <!-- Condições de Venda de Alta Engenharia -->
        <div class="terms-box">
            <div class="terms-title">Condições de Venda, Logística e Aceite</div>
            <strong>1. LOGÍSTICA:</strong> Entrega pós-compensação ou dinheiro/Pix à vista.<br><br>
            <strong>2. COMPATIBILIDADE iOS:</strong> Desativar Pop-ups no Safari para abrir Zap e Bradesco.
        </div>

        <!-- Controle de Trava de Segurança -->
        <label class="checkbox-container">
            <input type="checkbox" id="aceite" onchange="liberarBotoes()">
            Li e aceito as Condições.
        </label>

        <!-- Botões de Ação Direta -->
        <a href="https://wa.me" id="btnZap" class="btn btn-zap disabled" target="_blank">Chamar no Zap</a>
        <a href="https://banco.bradesco/html/classic/index.shtm" id="btnBanco" class="btn btn-bradesco disabled" target="_blank">Pagar no Bradesco</a>
    </div>

    <script>
        // Função que destrava os botões apenas se a caixa for marcada
        function liberarBotoes() {
            var checkbox = document.getElementById('aceite');
            var btnZap = document.getElementById('btnZap');
            var btnBanco = document.getElementById('btnBanco');
            
            if(checkbox.checked) {
                btnZap.classList.remove('disabled');
                btnBanco.classList.remove('disabled');
            } else {
                btnZap.classList.add('disabled');
                btnBanco.classList.add('disabled');
            }
        }
    </script>

</body>
</html>
