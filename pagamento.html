<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancada Digital - JCS Software v3.4</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 420px; width: 100%; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        .credibilidade { color: #7f8c8d; font-size: 13px; margin-bottom: 20px; font-weight: bold; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #219653; }
        #status-box { margin-top: 20px; padding: 15px; border-radius: 6px; font-weight: bold; line-height: 1.4; display: none; }
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .adm { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; font-size: 14px; text-align: left; }
        .alerta-reserva { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; text-align: left; }
        footer { margin-top: 40px; font-size: 12px; color: #7f8c8d; text-align: center; max-width: 500px; padding: 0 20px; }
        .jcs-logo { font-weight: bold; color: #2980b9; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Bakers & Ovos</h2>
    <!-- O painel lê o valor da memória automaticamente -->
    <div class="credibilidade">⭐ <span id="contador_clientes">17</span> clientes atendidos este mês</div>
    
    <div class="form-group">
        <label>Tipo de Pedido:</label>
        <select id="tipo_pedido">
            <option value="venda">Venda Direta (Pronta Entrega)</option>
            <option value="reserva">Reserva (Garantia para próxima Entrega)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Quantidade de Cartelas (Saldo: <span id="saldo_atual">1</span> Disponíveis):</label>
        <select id="qtd_cartelas" onchange="atualizarValorSugerido()">
            <option value="1">1 Cartela (R$ 13,00)</option>
            <option value="2">2 Cartelas (R$ 26,00 original)</option>
            <option value="3">3 Cartelas (R$ 39,00 original)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Valor que vai pagar (R$):</label>
        <input type="text" id="valor_pago" value="13">
    </div>

    <button onclick="processarPagamento()">Confirmar Pagamento</button>

    <div id="status-box"></div>
</div>

<footer>
    Site seguro por código de segurança homologado de transmissão direta. 
    <br><br>
    Desenvolvido por: <span class="jcs-logo">&lt; JCS_software /&gt;</span>
</footer>

<script>
// ##########################################################################
// ###                       PAINEL DE CONTROLO ADM                       ###
// ###   Mude os valores abaixo quando estiver no seu VS Code para iniciar  ###
// ##########################################################################

let clientesAtendidos = 14;  // <-- Mude aqui a meta de clientes históricos
let saldoCartelas = 3;       // <-- Mude aqui o stock do dia (Deixei 1 para o seu teste!)
const senhaSecretaADM = "999"; // <-- A sua senha da mochila (mude se quiser)

// ##########################################################################
// ###                     FIM DO PAINEL DE CONTROLO                      ###
// ##########################################################################


// Sincroniza os dados iniciais na tela
document.getElementById('saldo_atual').innerText = saldoCartelas;
document.getElementById('contador_clientes').innerText = clientesAtendidos;

function atualizarValorSugerido() {
    const qtd = parseInt(document.getElementById('qtd_cartelas').value);
    document.getElementById('valor_pago').value = qtd * 13;
}

function processarPagamento() {
    const tipo = document.getElementById('tipo_pedido').value;
    const qtd = parseInt(document.getElementById('qtd_cartelas').value);
    const entradaValor = document.getElementById('valor_pago').value.trim();
    const statusBox = document.getElementById('status-box');
    
    statusBox.style.display = "block";
    statusBox.className = "";
    statusBox.innerHTML = "";

    // 🎒 REGRA SECRETA DO ADM: MANOBRA DA MOCHILA (DIN DIN NA RUA)
    if (entradaValor === senhaSecretaADM) {
        if (saldoCartelas < qtd) {
            statusBox.className = "erro";
            statusBox.innerHTML = "❌ Erro ADM: Saldo insuficiente na bancada física para dar baixa!";
            return;
        }
        
        saldoCartelas -= qtd;
        clientesAtendidos += 1;
        
        document.getElementById('saldo_atual').innerText = saldoCartelas;
        document.getElementById('contador_clientes').innerText = clientesAtendidos;
        
        statusBox.className = "adm";
        statusBox.innerHTML = "🎒 <strong>Modo Mochila Ativado:</strong> Venda direta em dinheiro registada! <br>✓ Baixa dada no stock física.<br>✓ Contador subiu para " + clientesAtendidos + " clientes.";
        return;
    }

    const valorPago = parseFloat(entradaValor);
    const valorOriginal = qtd * 13;

    if (isNaN(valorPago)) {
        statusBox.className = "erro";
        statusBox.innerHTML = "❌ Por favor, insira um valor numérico válido.";
        return;
    }

    // REGRA SE FOR RESERVA: Aceita direto (fila de espera)
    if (tipo === "reserva") {
        if (valorPago < valorOriginal) {
            statusBox.className = "erro";
            statusBox.innerHTML = "❌ Pagamento Recusado! Para compras em modo Reserva, o valor correto é o preço total de tabela (R$ " + valorOriginal.toFixed(2) + ").";
        } else {
            clientesAtendidos += 1; 
            document.getElementById('contador_clientes').innerText = clientesAtendidos;
            statusBox.className = "sucesso";
            statusBox.innerHTML = "✅ Reserva Confirmada com sucesso! Valor recebido: R$ " + valorPago.toFixed(2) + "<br>A sua encomenda foi guardada na lista do próximo dia de entregas!";
        }
        return;
    }

    // REGRA DE VENDA DIRETA: Bloqueia se o stock for menor do que o pedido
    if (tipo === "venda" && saldoCartelas < qtd) {
        statusBox.className = "alerta-reserva";
        statusBox.innerHTML = "⏳ <strong>Stock do Dia Esgotado!</strong> Infelizmente a nossa bancada física já zerou o saldo para pronta entrega rápida. <br><br>💡 <strong>Não perca a sua viagem:</strong> Mude o 'Tipo de Pedido' lá em cima para <strong>Reserva</strong> e garanta já o seu produto fresquinho para a próxima logística de entregas (Segunda ou Sexta-feira)!";
        
        document.getElementById('tipo_pedido').value = "reserva";
        return;
    }

    // PROCESSAMENTO DE COMPRA CLIENTE COM SALDO DISPONÍVEL
    if (qtd === 1) {
        if (valorPago < 13) {
            statusBox.className = "erro";
            statusBox.innerHTML = "❌ Pagamento Recusado! O sistema não aceita valores menores que o preço de tabela.";
        } else {
            finalizarVendaCliente(1, valorPago);
        }
    } 
    else if (qtd === 2) {
        if (valorPago < 25) {
            statusBox.className = "erro";
            statusBox.innerHTML = "❌ Pagamento Recusado! Valor abaixo do mínimo permitido.";
        } else if (valorPago === 26 || valorPago === 25) {
            finalizarVendaCliente(2, 25, true);
        } else {
            finalizarVendaCliente(2, valorPago);
        }
    } 
    else if (qtd === 3) {
        if (valorPago < 36) {
            statusBox.className = "erro";
            statusBox.innerHTML = "❌ Pagamento Recusado! Valor abaixo do mínimo permitido.";
        } else if (valorPago === 39 || valorPago === 36) {
            finalizarVendaCliente(3, 36, true);
        } else {
            finalizarVendaCliente(3, valorPago);
        }
    }
}

function finalizarVendaCliente(qtd, valorFinal, comDesconto = false) {
    const statusBox = document.getElementById('status-box');
    
    saldoCartelas -= qtd;
    clientesAtendidos += 1;
    
    document.getElementById('saldo_atual').innerText = saldoCartelas;
    document.getElementById('contador_clientes').innerText = clientesAtendidos;
    document.getElementById('valor_pago').value = valorFinal;
    
    statusBox.className = "sucesso";
    if (comDesconto) {
        statusBox.innerHTML = "📢 Validação do Sistema... <br><br>🌟 Parabéns! O nosso sistema identificou a sua <strong>FIDELIDADE</strong> à nossa produção artesanal. O seu valor final foi recalculado. Pagamento de R$ " + valorFinal.toFixed(2) + " processado com sucesso!";
    } else {
        statusBox.innerHTML = "✅ Pagamento Aceito com sucesso! Valor recebido: R$ " + valorFinal.toFixed(2) + " (Obrigado pela preferência!)";
    }
}
</script>

</body>
</html>
