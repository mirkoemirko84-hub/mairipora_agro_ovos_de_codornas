<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suguimoto Agro - Pagamento</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: 0 auto; padding: 25px; border: 3px solid #9b59b6; border-radius: 12px; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { display: inline-block; padding: 15px 25px; font-size: 16px; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin: 10px; min-width: 180px; text-align: center; cursor: pointer; border: none; }
        .btn-next { background-color: #9b59b6; }
        .btn-back { background-color: #25d366; }
        
        /* Ajuste de tamanho de 250x250 para a imagem */
        .qr-caixa { 
            width: 250px; 
            height: 250px; 
            margin: 20px auto; 
            border: 2px solid #9b59b6; 
            border-radius: 10px;
            overflow: hidden;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-caixa img { width: 100%; height: 100%; object-fit: contain; }

        /* Caixa de Texto do Pix Copia e Cola */
        .pix-copia-cola { margin: 15px 0; }
        .pix-input { width: 80%; padding: 10px; font-size: 14px; text-align: center; border: 1px solid #ccc; border-radius: 6px; background-color: #eee; color: #555; }
        .btn-copiar { background-color: #8e44ad; padding: 10px 20px; font-size: 14px; color: white; border-radius: 6px; font-weight: bold; margin-top: 5px; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Tela de Pagamento: QR Code</h1>
        <h3>[ TELA 5: LEITURA DO CÓDIGO ]</h3>
        <p>Aponte a câmara do seu telemóvel ou copie o código Pix abaixo.</p>
        
        <!-- Imagem ajustada em 250x250 -->
        <div class="qr-caixa">
            <img src="QRCODE.png" alt="QR Code Pix Suguimoto">
        </div>

        <!-- O PULOS DO GATO: APAGUE O TEXTO ABAIXO E COLE O SEU CODIGO PIX REAL -->
        <div class="pix-copia-cola">
            <input type="text" class="pix-input" id="chavePix" value="COLE_AQUI_O_SEU_TEXTO_DO_PIX_COPIA_E_COLA" readonly><br>
            <button class="btn-copiar" onclick="copiarPix()">📋 Copiar Código Pix</button>
        </div>
        
        <hr>
        <div style="text-align: center;">
            <a href="zap/index.html" class="btn btn-back">⬅️ Voltar para Zap</a>
            <a href="agradecimento.html" class="btn btn-next">Confirmar Pagamento ➡️</a>
        </div>
    </div>

    <!-- Script profissional para fazer o botão copiar o texto sozinho -->
    <script>
        function copiarPix() {
            var copyText = document.getElementById("chavePix");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            document.execCommand("copy");
            alert("Código Pix copiado com sucesso! Agora é só colar no app do seu banco.");
        }
    </script>
</body>
</html>
