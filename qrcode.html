<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Seguro - QR Code</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f4; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; font-size: 24px; }
        .qrcode-box { background: #eee; padding: 20px; margin: 20px 0; border: 2px dashed #2e7d32; display: inline-block; }
        .botao-sucesso { display: inline-block; padding: 15px 30px; background-color: #2e7d32; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Tela de Pagamento Instantâneo</h1>
        <p>Aponte a câmara do seu telemóvel para o QR Code abaixo para concluir o pagamento de <strong>R$ 13,00</strong>.</p>
        
        <!-- O Espaço do QR Code Fujão -->
        <div class="qrcode-box">
            <p>[ IMAGEM DO SEU QR CODE PIX AQUI ]</p>
        </div>
        
        <p>Após fazer o pagamento, clique no botão abaixo para confirmar:</p>
        <a href="agradecimento.html" class="botao-sucesso">Já paguei! Confirmar Pedido ➡️</a>
    </div>
</body>
</html>
